[platformio]
default_envs = nologo_esp32c3_super_mini

[env]
framework = arduino
lib_ldf_mode = chain
lib_archive = false
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=3
extra_scripts = pre:../../../clean_examples.py, ../../../DomoticsCore-WebUI/embed_webui.py
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    ESP32Async/AsyncTCP
    ESP32Async/ESPAsyncWebServer
    file://../..
    file://../../../DomoticsCore-Core
    file://../../../DomoticsCore-Storage
    file://../../../DomoticsCore-Wifi
    file://../../../DomoticsCore-WebUI
lib_ignore = ESPAsyncTCP, RPAsyncTCP

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.32/platform-espressif32.zip
board = esp32dev
build_flags = ${env.build_flags} -std=gnu++14
build_unflags = -std=gnu++11
monitor_filters = esp32_exception_decoder

[env:esp32c3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.32/platform-espressif32.zip
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags} -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags = -std=gnu++11

[env:nologo_esp32c3_super_mini]
extends = env:esp32c3
board = nologo_esp32c3_super_mini

[env:esp32-c3-devkitc-02]
extends = env:esp32c3
board = esp32-c3-devkitc-02

